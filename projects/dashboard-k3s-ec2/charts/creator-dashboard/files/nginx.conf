# Mounted as /etc/nginx/conf.d/default.conf. TLS is terminated at the ALB.
server_tokens off;

map $uri $cd_cache_control {
    ~^/data/  "__DATA_CC__";
    default   "__ASSET_CC__";
}

server {
    listen 8080;
    server_name _;

    root  /srv/live;
    index index.html;

    set_real_ip_from __REAL_IP_FROM__;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml text/plain;

    # One place for headers (add_header in a location would drop server-level ones).
    add_header Cache-Control           $cd_cache_control always;
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "no-referrer" always;
    add_header X-Frame-Options         "DENY" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Read-only site: only GET/HEAD.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # ALB + kubelet health check: 200 only after the first S3 sync published a release.
    location = /healthz {
        access_log off;
        default_type text/plain;
        try_files /healthz.txt =503;
    }

    # Never serve dotfiles.
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
