apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cd.fullname" . }}
  labels:
    {{- include "cd.labels" . | nindent 4 }}
data:
  default.conf: |
    {{- .Files.Get "files/nginx.conf"
        | replace "__DATA_CC__" .Values.nginx.cacheControl.data
        | replace "__ASSET_CC__" .Values.nginx.cacheControl.assets
        | replace "__REAL_IP_FROM__" .Values.nginx.realIpFrom
        | nindent 4 }}
  sync.sh: |
    {{- .Files.Get "files/sync.sh" | nindent 4 }}
