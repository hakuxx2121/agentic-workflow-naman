{{- if .Values.networkPolicy.enabled }}
# k3s enforces NetworkPolicy out of the box (embedded kube-router).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cd.fullname" . }}
  labels:
    {{- include "cd.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cd.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # ALB (via NodePort, source IP kept by externalTrafficPolicy: Local) and kubelet probes, all from the VPC.
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.vpcCidr }}
      ports:
        - port: {{ .Values.nginx.containerPort }}
          protocol: TCP
  egress:
    - ports: # DNS
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to: # IMDSv2 for the instance-role credentials
        - ipBlock: {cidr: 169.254.169.254/32}
      ports:
        - {port: 80, protocol: TCP}
    - ports: # S3 over HTTPS
        - {port: 443, protocol: TCP}
{{- end }}
