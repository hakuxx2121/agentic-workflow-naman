apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cd.fullname" . }}
  labels:
    {{- include "cd.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # keep the old pod serving until the new one has its first sync
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "cd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cd.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "cd.fullname" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx-unprivileged's uid; the sync containers use it too so files are readable
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: s3-initial-sync
          image: "{{ .Values.sync.image.repository }}:{{ .Values.sync.image.tag }}"
          imagePullPolicy: {{ .Values.sync.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/sync.sh", "--once"]
          env:
            {{- include "cd.syncEnv" . | nindent 12 }}
          securityContext:
            {{- include "cd.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.sync.resources | nindent 12 }}
          volumeMounts:
            - {name: site, mountPath: /srv}
            - {name: sync-tmp, mountPath: /tmp}
            - {name: config, mountPath: /scripts/sync.sh, subPath: sync.sh, readOnly: true}
      containers:
        - name: nginx
          image: "{{ .Values.nginx.image.repository }}:{{ .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.nginx.containerPort }}
              protocol: TCP
          env:
            - name: NGINX_ENTRYPOINT_QUIET_LOGS
              value: "1"
          securityContext:
            {{- include "cd.containerSecurity" . | nindent 12 }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.nginx.resources | nindent 12 }}
          volumeMounts:
            - {name: site, mountPath: /srv, readOnly: true}
            - {name: nginx-tmp, mountPath: /tmp}
            - {name: config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
        - name: s3-sync
          image: "{{ .Values.sync.image.repository }}:{{ .Values.sync.image.tag }}"
          imagePullPolicy: {{ .Values.sync.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/sync.sh"]
          env:
            {{- include "cd.syncEnv" . | nindent 12 }}
          securityContext:
            {{- include "cd.containerSecurity" . | nindent 12 }}
          # Healthy while the last successful sync is younger than 3 intervals.
          # (The init container wrote the first heartbeat into the shared sync-tmp volume.)
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test $(( $(date +%s) - $(cat /tmp/heartbeat) )) -lt {{ mul 3 .Values.sync.intervalSeconds }}
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 2
          resources:
            {{- toYaml .Values.sync.resources | nindent 12 }}
          volumeMounts:
            - {name: site, mountPath: /srv}
            - {name: sync-tmp, mountPath: /tmp}
            - {name: config, mountPath: /scripts/sync.sh, subPath: sync.sh, readOnly: true}
      volumes:
        - name: site
          emptyDir:
            sizeLimit: 256Mi
        - name: sync-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: config
          configMap:
            name: {{ include "cd.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
