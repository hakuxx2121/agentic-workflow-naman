# Creator Calls dashboard. Only `sync.bucket` is required (from `terraform output -raw bucket_name`).

nameOverride: ""
fullnameOverride: ""

replicaCount: 1 # one node; the emptyDir is per pod, so more replicas just sync more often

nginx:
  image:
    repository: nginxinc/nginx-unprivileged
    tag: "1.30-alpine" # multi-arch (arm64 for t4g)
    pullPolicy: IfNotPresent
  containerPort: 8080
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 250m, memory: 64Mi}
  # Cache headers nginx sends to browsers.
  cacheControl:
    data: "no-cache"                 # data/*.json: always revalidate (page also fetches with no-store)
    assets: "public, max-age=300"    # html/css/js/vendor
  # Trust X-Forwarded-For only from inside the VPC (the ALB), so logs show real client IPs.
  realIpFrom: "10.60.0.0/16"

sync:
  image:
    repository: amazon/aws-cli
    tag: "2.40.3" # multi-arch
    pullPolicy: IfNotPresent
  bucket: ""           # REQUIRED: terraform output -raw bucket_name
  prefix: "site/"      # terraform output -raw data_prefix
  region: us-east-1
  intervalSeconds: 600 # every 10 minutes
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {cpu: 250m, memory: 192Mi}

service:
  type: NodePort
  port: 80
  nodePort: 30080 # must equal terraform output node_port (the ALB target group port)
  externalTrafficPolicy: Local

networkPolicy:
  enabled: true
  vpcCidr: "10.60.0.0/16" # terraform output -raw vpc_cidr

podAnnotations: {}
nodeSelector: {}
tolerations: []
