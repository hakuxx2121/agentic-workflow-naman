# Envoy sits in front of llama.cpp only to give us a real request-latency histogram
# (envoy_cluster_upstream_rq_time_bucket). llama.cpp's own /metrics has tokens/sec but no per-request latency.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-envoy
  namespace: llm
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    static_resources:
      listeners:
        - name: http
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress
                    route_config:
                      virtual_hosts:
                        - name: llm
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/" }
                              route: { cluster: llm, timeout: 300s }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: llm
          type: STATIC
          connect_timeout: 2s
          load_assignment:
            cluster_name: llm
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: 127.0.0.1, port_value: 8081 }
