apiVersion: v1
kind: Service
metadata:
  name: llm-cpu
  namespace: llm
  labels:
    app.kubernetes.io/name: llm-cpu
spec:
  type: ClusterIP # reach it with kubectl port-forward; no paid load balancer
  selector:
    app.kubernetes.io/name: llm-cpu
  ports:
    - { name: http, port: 80, targetPort: http }
