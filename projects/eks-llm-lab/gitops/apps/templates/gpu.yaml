{{- if .Values.gpu.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  source:
    repoURL: https://nvidia.github.io/k8s-device-plugin
    chart: nvidia-device-plugin
    targetRevision: {{ .Values.charts.nvidiaDevicePlugin }}
    helm:
      valuesObject:
        # Run only on Karpenter GPU nodes and tolerate their taint.
        affinity: {}
        nodeSelector:
          workload-type: gpu
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
  {{- include "app.sync" . | nindent 2 }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-gpu
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: llm
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: gitops/workloads/llm-gpu
  {{- include "app.sync" . | nindent 2 }}
{{- end }}
