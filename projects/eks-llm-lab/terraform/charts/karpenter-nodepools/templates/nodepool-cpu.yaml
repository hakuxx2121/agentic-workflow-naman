apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: cpu-spot
spec:
  template:
    metadata:
      labels:
        workload-type: cpu
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 168h
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ toJson .Values.cpu.capacityTypes }}
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: {{ toJson .Values.cpu.categories }}
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: {{ toJson .Values.cpu.sizes }}
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["5"]
  limits:
    cpu: {{ .Values.cpu.cpuLimit }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 2m
