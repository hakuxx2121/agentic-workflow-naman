# nginx standing in for NetScaler / ALB "mTLS verify" mode.
events {}
http {
  upstream appian { server backend:8080; }

  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate         /pki/server-chain.pem;
    ssl_certificate_key     /pki/server.key;
    ssl_protocols           TLSv1.2 TLSv1.3;

    # --- mTLS verify (like ALB mutual_authentication mode=verify) ---
    ssl_client_certificate  /pki/ca-bundle.pem;   # trust store (also advertised CA names)
    ssl_verify_client       on;                   # no/invalid cert => rejected
    ssl_verify_depth        2;                    # leaf -> issuing CA -> root
    ssl_crl                 /pki/crl-chain.pem;   # revocation (nginx needs a CRL for every CA level)

    location / {
      # Overwrite (never pass through) identity headers so clients can't spoof them.
      # Format mimics ALB verify mode: X-Amzn-Mtls-Clientcert-*
      proxy_set_header X-Amzn-Mtls-Clientcert-Subject       $ssl_client_s_dn;   # RFC2253
      proxy_set_header X-Amzn-Mtls-Clientcert-Issuer        $ssl_client_i_dn;
      proxy_set_header X-Amzn-Mtls-Clientcert-Serial-Number $ssl_client_serial;
      proxy_set_header X-Amzn-Mtls-Clientcert-Validity      "NotBefore=$ssl_client_v_start;NotAfter=$ssl_client_v_end";
      proxy_set_header X-Amzn-Mtls-Clientcert-Leaf          $ssl_client_escaped_cert;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://appian;
    }
  }
}
